<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class = "embeddings-page">
    <h3>Embedding Visualizer</h3>

    <a href="index.html">
        <button type="button">Back to spinner</button>
    </a>

    <a href="pointembeddings.html">
        <button type="button">
            Point Embedding Explorer
        </button>
    </a>

    <label for="embeddingText">Enter text:</label>
    <textarea id="embeddingText"></textarea>

    <button type="button" id="axisMapButton">
        Show AI axis map
    </button>

    <canvas id="axisCanvas" width="400" height="300"></canvas>

    <a href="cumulative.html">
        <button type="button">
            Cumulative concept graph
        </button>
    </a>

    <label for="similarityMetric">
        Similarity metric:
    </label>

    <select id="similarityMetric">
        <option value="cosine" selected>
            Cosine similarity
        </option>

        <option value="dot">
            Dot product
        </option>
    </select>

    <input id="xAxisInput" placeholder="x-axis concept, e.g. royalty">
    <input id="yAxisInput" placeholder="y-axis concept, e.g. gender">

    <button type="button" id="customAxisButton">
        Show custom axis map
    </button>

    <canvas id="customAxisCanvas" width="500" height="350"></canvas>

    <script src="embeddings.js"></script>
</body>
</html>
