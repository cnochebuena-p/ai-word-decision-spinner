<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body class = "point-page">
    <h2>Point Embedding Explorer</h2>

    <a href="embeddings.html">
        <button type="button">Back to Embeddings</button>
    </a>

    <label for="pointXAxis">X-axis concept:</label>
    <input id="pointXAxis" placeholder="Leave blank for AI choice">

    <label for="pointYAxis">Y-axis concept:</label>
    <input id="pointYAxis" placeholder="Leave blank for AI choice">

    <div class="point-page">
        <canvas id="pointCanvas" width="500" height="500"></canvas>

        <div class="word-inputs">
            <h3>Words</h3>

            <input id="word1" placeholder="Word 1">
            <input id="word2" placeholder="Word 2">
            <input id="word3" placeholder="Word 3">
            <input id="word4" placeholder="Word 4">
            <input id="word5" placeholder="Word 5">
            <input id="word6" placeholder="Word 6">
            <input id="word7" placeholder="Word 7">
            <input id="word8" placeholder="Word 8">
        </div>
    </div>

    <div class="coordinate-inputs">
        <h3>Coordinates</h3>

        <input id="coord1" placeholder="(-1, -1)">
        <input id="coord2" placeholder="(1, -1)">
        <input id="coord3" placeholder="(0, 0)">
        <input id="coord4" placeholder="(1, 1)">
        <input id="coord5" placeholder="(-1, 1)">
        <input id="coord6" placeholder="(0.5, -0.5)">
        <input id="coord7" placeholder="(-0.5, 0.5)">
        <input id="coord8" placeholder="(0.2, 0.8)">
    </div>

    <button type="button" id="plotPointsButton">
        Plot points
    </button>

    <button type="button" id="checkPointsButton" style="display: none;">
        Check actual embedding points
    </button>

    <p id="actualAxesUsed"></p>

    <p id="pointScore"></p>

    <script src="pointembeddings.js"></script>
</body>
</html>
