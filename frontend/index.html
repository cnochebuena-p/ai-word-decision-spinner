<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <h3> Hello World! </h3>
    <input type="range" min="0" max="20" value="10"
    class="slider" id="temperatureSlider">
    <input type="range" min="0" max="10" value="5"
    class="slider" id="topPSlider">
    <span id="temperatureSliderValue"> 10 </span>
    <span id="topPSliderValue"> 10 </span>
    <a href="/" class="logo-link">
        <img src = "https://i.imgur.com/U1035dV.png" class="logo">
    </a>
    <label for="usertext"> Enter your text: </label>
    <input type="text" id="usertext">
    <button type="button" id="wordpredict"> Predict next words </button>
    <span id="buttonValue"> x </span>
    <div class="spinner-area">
    <div class="pointer">▼</div>
    <div id="wheel"></div>
    <button type="button" id="spinButton">Spin</button>
    </div>
    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
