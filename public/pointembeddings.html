<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="style.css">
    <title>Embeddings Score Activity</title>
</head>

<body class="point-page">
    <header class="point-header">
        <h2>Embeddings Score Activity</h2>

        <a href="embeddings.html" class="nav-button">
            Back to Embeddings
        </a>
    </header>

    <div class="point-axis-controls">
        <div>
            <label for="pointXAxis">X-axis concept:</label>
            <input
                id="pointXAxis"
                value="traditionalness"
                placeholder="Leave blank for AI choice"
            >
        </div>

        <div>
            <label for="pointYAxis">Y-axis concept:</label>
            <input
                id="pointYAxis"
                value="energy"
                placeholder="Leave blank for AI choice"
            >
        </div>
    </div>

    <main class="point-explorer-layout">
        <section class="point-graph-section">
            <canvas
                id="pointCanvas"
                width="800"
                height="700"
            ></canvas>
        </section>

        <section class="point-input-panel">
            <h3>Words and coordinates</h3>

            <div class="point-input-headings">
                <span>Word</span>
                <span>Coordinate</span>
            </div>

            <div class="point-input-row">
                <input id="word1" value="pop" placeholder="Word 1">
                <input id="coord1" value="(0, 0)" placeholder="(-1, -1)">
            </div>

            <div class="point-input-row">
                <input id="word2" value="jazz" placeholder="Word 2">
                <input id="coord2" value="(1, 1)" placeholder="(1, -1)">
            </div>

            <div class="point-input-row">
                <input id="word3" value="rock" placeholder="Word 3">
                <input id="coord3" value="(-1, 1)" placeholder="(0, 0)">
            </div>

            <div class="point-input-row">
                <input id="word4" value="electronic" placeholder="Word 4">
                <input id="coord4" value="(1, -1)" placeholder="(1, 1)">
            </div>

            <div class="point-input-row">
                <input id="word5" value="classical" placeholder="Word 5">
                <input id="coord5" value="(-1, -1)" placeholder="(-1, 1)">
            </div>

            <div class="point-input-row">
                <input id="word6" placeholder="Word 6">
                <input id="coord6" placeholder="(0.5, -0.5)">
            </div>

            <div class="point-input-row">
                <input id="word7" placeholder="Word 7">
                <input id="coord7" placeholder="(-0.5, 0.5)">
            </div>

            <div class="point-input-row">
                <input id="word8" placeholder="Word 8">
                <input id="coord8" placeholder="(0.2, 0.8)">
            </div>

            <div class="point-action-buttons">
                <button type="button" id="plotPointsButton">
                    Plot points
                </button>

                <button
                    type="button"
                    id="checkPointsButton"
                    style="display: none;"
                >
                    Check actual embedding points
                </button>
            </div>

            <p id="actualAxesUsed"></p>
            <p id="pointScore"></p>
        </section>
    </main>

    <script src="pointembeddings.js"></script>
</body>
</html>
