<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Custom Embedding Axes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="custom-axes-page">
    <header class="custom-axes-header">
        <h2>Custom Axes Embeddings</h2>

        <a href="index.html" class="nav-button">
            Back to Spinner
        </a>

        <a href="cumulative.html" class="nav-button">
            Cumulative Concept Graph
        </a>

        <a href="pointembeddings.html" class="nav-button">
            Embeddings Score Activity
        </a>
    </header>

    <main class="custom-axes-layout">
        <section class="custom-axes-graph-area">
            <canvas
                id="customAxisCanvas"
                width="850"
                height="600"
            ></canvas>
        </section>

        <section class="custom-axes-controls">
            <label for="customAxisText">
                Enter words:
            </label>

            <textarea
                id="customAxisText"
                placeholder="For example: king queen man woman"
            ></textarea>

            <label for="xAxisInput">
                X-axis concept:
            </label>

            <input
                id="xAxisInput"
                placeholder="For example: royalty"
            >

            <label for="yAxisInput">
                Y-axis concept:
            </label>

            <input
                id="yAxisInput"
                placeholder="For example: gender"
            >

            <fieldset class="embedding-source-options">
                <legend>Coordinate source</legend>

                <label>
                    <input
                        type="radio"
                        name="embeddingSource"
                        value="chatgpt"
                        checked
                    >
                    ChatGPT-generated positions
                </label>

                <label>
                    <input
                        type="radio"
                        name="embeddingSource"
                        value="openai"
                    >
                    OpenAI embeddings
                </label>
            </fieldset>

            <button
                type="button"
                id="customAxisButton"
                class="nav-button"
            >
                Show Custom Axis Map
            </button>

            <p id="customAxisMessage"></p>

            <section
                id="guessActivity"
                class="guess-activity"
                hidden
            >
                <h3>Guess the Hidden Points</h3>

                <p>
                    Drag the two new words to where you think they belong.
                    Then press Check Guesses.
                </p>

                <div id="guessWordContainer"></div>

                <button
                    type="button"
                    id="checkGuessesButton"
                    class="nav-button"
                >
                    Check Guesses
                </button>

                <button
                    type="button"
                    id="toggleGuessPointsButton"
                    class="nav-button"
                >
                    Hide Guess Points
                </button>

                <p id="guessMessage"></p>
            </section>
        </section>
    </main>

    <script src="customaxes.js"></script>
</body>
</html>
