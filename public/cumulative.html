<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cumulative Concept Graph</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="cumulative-page">

    <header class="cumulative-header">
        <h2>Cumulative Concept Graph</h2>

        <a href="embeddings.html" class="nav-button">
            Back to Embeddings
        </a>
    </header>

    <main class="cumulative-layout">

        <section class="cumulative-graph-area">
            <canvas
                id="conceptCanvas"
                width="850"
                height="600"
            ></canvas>

            <div id="conceptTooltip"></div>
        </section>

        <section class="cumulative-controls">

            <label for="cumulativeText">
                Enter text:
            </label>

            <textarea
                id="cumulativeText"
                placeholder="For example: sun ice fire"
            ></textarea>

            <button
                type="button"
                id="conceptGraphButton"
                class="nav-button"
            >
                Show Cumulative Concept Graph
            </button>

            <button
                type="button"
                id="toggleConceptGraphButton"
                class="nav-button"
            >
                Switch to Embedding Cumulative Graph
            </button>
        </section>

    </main>

    <script src="cumulative.js"></script>
</body>
</html>
